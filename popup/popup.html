<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenShot Turbo</title>
  <link rel="icon" type="image/png" href="../icons/Icon32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="logo-text">
          <h1>ScreenShot <span class="accent-turbo">Turbo</span></h1>
          <span class="version-badge">v1.2</span>
        </div>
      </div>
      <button id="btn-open-settings" class="icon-btn" title="Configurações" data-i18n-title="btnSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Seção de Ações Rápidas de Captura -->
    <section class="capture-actions">
      <!-- Predefinição do Usuário -->
      <button class="action-card" id="btn-cap-preset">
        <div class="card-icon accent-cyan">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-title" data-i18n="presetTitle">Predefinição do Usuário</span>
          <span class="card-desc" id="preset-desc" data-i18n="presetDesc">Usa o modo padrão das configurações</span>
        </div>
      </button>

      <!-- Janela Visível -->
      <button class="action-card primary-card" id="btn-cap-visible">
        <div class="card-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-title" data-i18n="visibleWindow">Janela Visível</span>
          <span class="card-desc" data-i18n="visibleDesc">Captura o que está na tela agora</span>
        </div>
        <span class="shortcut-tag">Alt+Shift+V</span>
      </button>

      <!-- Seleção Livre -->
      <button class="action-card" id="btn-cap-selection">
        <div class="card-icon accent-cyan">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3H3v3M18 3h3v3M6 21H3v-3M18 21h3v-3M9 3h6M9 21h6M3 9v6M21 9v6"></path>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-title" data-i18n="freeSelection">Seleção Livre</span>
          <span class="card-desc" data-i18n="freeSelectionDesc">Recorte livre na página</span>
        </div>
        <span class="shortcut-tag">Alt+Shift+S</span>
      </button>

      <!-- Página Inteira -->
      <button class="action-card" id="btn-cap-full">
        <div class="card-icon accent-indigo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v18M8 17l4 4 4-4M8 7l4-4 4 4"></path>
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2" stroke-dasharray="3 3"></rect>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-title" data-i18n="fullPage">Página Inteira</span>
          <span class="card-desc" data-i18n="fullPageDesc">Rolagem e captura automática</span>
        </div>
        <span class="shortcut-tag">Alt+Shift+F</span>
      </button>
    </section>

    <!-- Proporções Rápidas com Detecção Automática de Orientação -->
    <section class="ratios-section">
      <div class="section-header">
        <span class="section-title" data-i18n="presetRatios">Proporções Predefinidas</span>
        <span class="auto-orient-badge" data-i18n="autoOrientation">Orientação Auto</span>
      </div>
      <div class="ratio-grid">
        <button class="ratio-btn" data-ratio="1:1">
          <span class="ratio-label">1:1</span>
          <span class="ratio-desc" data-i18n="ratioSquare">Quadrado</span>
        </button>
        <button class="ratio-btn" data-ratio="3:2">
          <span class="ratio-label">3:2</span>
          <span class="ratio-desc" data-i18n="ratioPhoto">Foto</span>
        </button>
        <button class="ratio-btn" data-ratio="4:3">
          <span class="ratio-label">4:3</span>
          <span class="ratio-desc" data-i18n="ratioMonitor">Monitor</span>
        </button>
        <button class="ratio-btn" data-ratio="5:4">
          <span class="ratio-label">5:4</span>
          <span class="ratio-desc" data-i18n="ratioFrame">Quadro</span>
        </button>
        <button class="ratio-btn" data-ratio="16:9">
          <span class="ratio-label">16:9</span>
          <span class="ratio-desc" data-i18n="ratioWidescreen">Widescreen</span>
        </button>
      </div>
    </section>

    <!-- Rodapé com mensagem de status -->
    <div id="status-message" class="status-box" style="display: none;"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
