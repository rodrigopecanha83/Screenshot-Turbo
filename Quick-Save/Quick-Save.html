<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenShot Turbo — Salvamento Rápido</title>
  <link rel="stylesheet" href="Quick-Save.css">
</head>
<body class="Corpo-Pagina">
  <div class="Janela-Salvar">
    <header class="Cabecalho-Janela">
      <div class="Identidade-Visual">
        <div class="Logo-Badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div>
          <h1 class="Titulo-Janela">Salvar Captura</h1>
          <span class="Subtitulo-Janela" id="Dominio-Origem">Salvamento Rápido</span>
        </div>
      </div>
    </header>

    <main class="Conteudo-Principal">
      <div class="Card-Previa">
        <div class="Container-Imagem">
          <img id="Imagem-Previa" class="Imagem-Previa" alt="Prévia da captura" />
        </div>
      </div>

      <div class="Card-Configuracao">
        <label for="Campo-Nome-Arquivo" class="Rotulo-Campo">Nome do Arquivo</label>
        <div class="Grupo-Entrada">
          <input type="text" id="Campo-Nome-Arquivo" class="Entrada-Texto" spellcheck="false" autocomplete="off" />
        </div>
      </div>

      <div id="Mensagem-Status" class="Mensagem-Status" style="display: none;"></div>
    </main>

    <footer class="Rodape-Janela">
      <div class="Dica-Teclado">
        <span><kbd>Enter</kbd> Salvar</span>
        <span><kbd>Esc</kbd> Cancelar</span>
      </div>
      <div class="Grupo-Acoes">
        <button type="button" id="Botao-Cancelar" class="Botao-Secundario">Cancelar</button>
        <button type="button" id="Botao-Salvar" class="Botao-Primario" autofocus>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Salvar Imagem
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="Quick-Save.js"></script>
</body>
</html>
